server:
  port: 8081

spring:
  application:
    name: gateway-service

  cloud:
    discovery:
      enabled: false

    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:9090
              predicates:
                - Path=/task/user/**

            - id: order-service
              uri: http://localhost:9091
              predicates:
                - Path=/task/order/**
         
            - id: payment-service
              uri: http://localhost:9092
              predicates:
                - Path=/task/payment/**		

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG